name: scan2world

x-python-env: &python-env
  DATA_DIR: /data
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-scan2world}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-scan2world}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN}
  DATA_DIR: /data
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  VISION_URL: http://vision:8000
  RECON_URL: http://recon:8000
  GEOMETRY_URL: http://geometry:8000
  MAX_IMAGES: ${MAX_IMAGES:-200}
  MAX_FILE_MB: ${MAX_FILE_MB:-40}
  MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-healthcheck-python: &python-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scan2world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scan2world}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ./apps/api, target: prod }
    image: scan2world-api
    restart: unless-stopped
    environment: *node-env
    ports: ["${API_PORT:-3000}:3000"]
    volumes: [data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: scan2world-api
    restart: unless-stopped
    command: ["node", "dist/worker"]
    environment: *node-env
    volumes: [data:/data]
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_healthy }

  vision:
    build: { context: ./services, dockerfile: vision/Dockerfile }
    restart: unless-stopped
    environment: *python-env
    volumes: [data:/data]
    healthcheck: *python-health

  recon:
    build: { context: ./services, dockerfile: recon/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *python-env
      RECON_THREADS: ${RECON_THREADS:-8}
    volumes: [data:/data]
    healthcheck: *python-health
    deploy:
      resources:
        limits: { memory: "${RECON_MEMORY_LIMIT:-10g}" }

  geometry:
    build: { context: ./services, dockerfile: geometry/Dockerfile }
    restart: unless-stopped
    environment: *python-env
    volumes: [data:/data]
    healthcheck: *python-health
    deploy:
      resources:
        limits: { memory: "${GEOMETRY_MEMORY_LIMIT:-6g}" }

  web:
    build: { context: ./apps/web }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  data:
